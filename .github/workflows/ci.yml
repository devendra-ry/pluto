name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      APP_URL: http://localhost:3000
      GEMINI_API_KEY: ci-gemini-key
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unused code audit
        run: npm run knip

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Optimized Markdown worker smoke test
        run: npm run check:markdown-worker-build

      - name: Browser smoke test
        run: npm run test:e2e

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: supabase/setup-cli@v3
        with:
          version: 2.119.0
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply all migrations to a fresh local Supabase database
        run: supabase start
      - name: Reset and verify reproducible migration history
        run: supabase db reset --local
      - name: Database ownership, fencing, lifecycle and concurrency regressions
        run: node scripts/test-database.mjs
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
